<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My HTML Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background: #f5f5f5;
        }

        .card {
            background: white;
            padding: 20px;
            width: 350px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        input,
        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            font-size: 16px;
        }

        button {
            background: #0078ff;
            border: none;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #005ecc;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Welcome</h2>
        <p>Enter your name and send it to the FastAPI backend.</p>

        <form id="myForm">
            <input type="text" id="nameInput" placeholder="Your name">
            <button type="submit">Send</button>
        </form>

        <p id="response"></p>
    </div>

    <script>
        document.getElementById("myForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const name = document.getElementById("nameInput").value;

            const res = await fetch("http://127.0.0.1:8000/api/hello", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name })
            });

            const data = await res.json();
            document.getElementById("response").innerText = data.message;
        });
    </script>

</body>

</html>
